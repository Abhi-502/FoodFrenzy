spring.application.name=FoodFrenzy
server.port=${SERVER_PORT:8080}

# Active profile: defaults to mysql if env vars supplied or fallback to dev (embedded MySQL-compatible H2)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Default Admin Seed Config
app.admin.email=${APP_ADMIN_EMAIL:admin@foodfrenzy.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}
app.admin.name=System Administrator
app.admin.phone=+1-555-0199

# Order Delivery & Tax Rates
app.order.tax-rate=0.08
app.order.delivery-fee=4.99
app.order.free-delivery-threshold=50.00
