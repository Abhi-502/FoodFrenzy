<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile - FoodFrenzy</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<!-- Navigation -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Alerts -->
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                        <div class="bg-danger-subtle text-danger rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 64px; height: 64px;">
                            <i class="bi bi-person-circle fs-2"></i>
                        </div>
                        <div>
                            <h2 class="fw-bold mb-0 text-dark" th:text="${user.name}">Customer Name</h2>
                            <span class="text-muted small" th:text="${user.email}">user@example.com</span>
                            <span class="badge bg-success-subtle text-success ms-2">Active Member</span>
                        </div>
                    </div>

                    <h5 class="fw-bold mb-3">Update Personal Details</h5>

                    <form th:action="@{/profile}" th:object="${profile}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label small fw-semibold">Full Name</label>
                            <input type="text" id="name" th:field="*{name}"
                                   class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">Email Address (Locked)</label>
                            <input type="email" id="email" th:value="${user.email}" class="form-control bg-light" readonly disabled>
                            <small class="text-muted">Email is used for account login and cannot be altered.</small>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label small fw-semibold">Contact Phone</label>
                            <input type="text" id="phone" th:field="*{phone}"
                                   class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="address" class="form-label small fw-semibold">Primary Delivery Address</label>
                            <textarea id="address" th:field="*{address}" rows="3"
                                      class="form-control" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''" required></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <span class="text-muted small">
                                Member since <span th:text="${#temporals.format(user.createdAt, 'MMM yyyy')}">Date</span>
                            </span>
                            <button type="submit" class="btn btn-primary-custom rounded-pill px-4">
                                <i class="bi bi-save me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
