<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found - FoodFrenzy</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<!-- Navigation -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container text-center py-5">
        <div class="card border-0 shadow-sm rounded-4 p-5 max-w-lg mx-auto bg-white">
            <div class="text-warning mb-3">
                <i class="bi bi-compass display-1"></i>
            </div>
            <h1 class="display-5 fw-bold text-dark mb-2">404 - Page Not Found</h1>
            <p class="text-secondary fs-5 mb-4" th:text="${errorMessage != null ? errorMessage : 'The dish or page you are looking for does not exist or has been moved.'}">
                Page not found.
            </p>
            <div>
                <a th:href="@{/menu}" class="btn btn-primary-custom rounded-pill px-4">
                    <i class="bi bi-grid me-1"></i> Browse Delicious Menu
                </a>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
