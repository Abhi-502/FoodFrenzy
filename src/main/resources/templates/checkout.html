<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - FoodFrenzy</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<!-- Navigation -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Alerts -->
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="py-5">
    <div class="container">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/cart}">Cart</a></li>
                <li class="breadcrumb-item active text-dark fw-bold" aria-current="page">Checkout</li>
            </ol>
        </nav>

        <h1 class="fw-bold mb-4">Complete Your Order</h1>

        <form th:action="@{/orders}" th:object="${checkout}" method="post">
            <div class="row g-4">
                <!-- Delivery & Contact Info Column -->
                <div class="col-lg-7">
                    <!-- Contact Info Card -->
                    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                        <h5 class="fw-bold mb-3 d-flex align-items-center gap-2">
                            <i class="bi bi-person-lines-fill text-danger"></i> 1. Contact & Recipient Details
                        </h5>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="recipientName" class="form-label small fw-semibold">Recipient Name</label>
                                <input type="text" id="recipientName" th:field="*{recipientName}"
                                       class="form-control" th:classappend="${#fields.hasErrors('recipientName')} ? 'is-invalid' : ''"
                                       placeholder="Full name for delivery" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('recipientName')}" th:errors="*{recipientName}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="recipientPhone" class="form-label small fw-semibold">Contact Phone Number</label>
                                <input type="text" id="recipientPhone" th:field="*{recipientPhone}"
                                       class="form-control" th:classappend="${#fields.hasErrors('recipientPhone')} ? 'is-invalid' : ''"
                                       placeholder="For delivery call" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('recipientPhone')}" th:errors="*{recipientPhone}"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Delivery Address Card -->
                    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                        <h5 class="fw-bold mb-3 d-flex align-items-center gap-2">
                            <i class="bi bi-geo-alt-fill text-danger"></i> 2. Delivery Destination
                        </h5>

                        <div class="mb-3">
                            <label for="street" class="form-label small fw-semibold">Street Address / Apartment / Suite</label>
                            <input type="text" id="street" th:field="*{street}"
                                   class="form-control" th:classappend="${#fields.hasErrors('street')} ? 'is-invalid' : ''"
                                   placeholder="123 Delicious Boulevard, Apt 4B" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('street')}" th:errors="*{street}"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-5">
                                <label for="city" class="form-label small fw-semibold">City</label>
                                <input type="text" id="city" th:field="*{city}"
                                       class="form-control" th:classappend="${#fields.hasErrors('city')} ? 'is-invalid' : ''"
                                       placeholder="City" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="state" class="form-label small fw-semibold">State / Region</label>
                                <input type="text" id="state" th:field="*{state}"
                                       class="form-control" th:classappend="${#fields.hasErrors('state')} ? 'is-invalid' : ''"
                                       placeholder="State" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></div>
                            </div>
                            <div class="col-md-3">
                                <label for="postalCode" class="form-label small fw-semibold">Postal Code</label>
                                <input type="text" id="postalCode" th:field="*{postalCode}"
                                       class="form-control" th:classappend="${#fields.hasErrors('postalCode')} ? 'is-invalid' : ''"
                                       placeholder="Postal code" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}"></div>
                            </div>
                        </div>

                        <div class="mb-0">
                            <label for="specialInstructions" class="form-label small fw-semibold">Special Delivery Instructions (Optional)</label>
                            <textarea id="specialInstructions" th:field="*{specialInstructions}" rows="2"
                                      class="form-control" placeholder="Gate code, landmark, or contactless drop-off note..."></textarea>
                        </div>
                    </div>

                    <!-- Payment Method Card -->
                    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                        <h5 class="fw-bold mb-3 d-flex align-items-center gap-2">
                            <i class="bi bi-wallet2 text-danger"></i> 3. Payment Method
                        </h5>

                        <div class="form-check p-3 border rounded-3 bg-light d-flex align-items-center gap-3">
                            <input class="form-check-input ms-0 me-2" type="radio" name="paymentMethod" id="codPayment"
                                   value="CASH_ON_DELIVERY" checked>
                            <label class="form-check-label w-100" for="codPayment">
                                <span class="fw-bold d-block text-dark">Cash On Delivery (COD)</span>
                                <small class="text-muted">Pay securely with cash or card upon receiving your order at your doorstep.</small>
                            </label>
                            <i class="bi bi-cash-coin fs-3 text-success"></i>
                        </div>
                    </div>
                </div>

                <!-- Order Review Column -->
                <div class="col-lg-5">
                    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white sticky-top" style="top: 90px;">
                        <h5 class="fw-bold mb-3">Order Review</h5>

                        <!-- Line Items List -->
                        <div class="d-flex flex-column gap-3 mb-4 max-h-60 overflow-auto">
                            <div th:each="item : ${cart.items}" class="d-flex align-items-center justify-content-between pb-2 border-bottom">
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge bg-light text-dark border px-2 py-1" th:text="${item.quantity + 'x'}">1x</span>
                                    <div>
                                        <span class="fw-semibold small d-block" th:text="${item.product.name}">Dish Name</span>
                                        <small class="text-muted" th:text="${'$' + #numbers.formatDecimal(item.product.price, 1, 2) + ' each'}">$0.00</small>
                                    </div>
                                </div>
                                <span class="fw-bold small text-dark" th:text="${'$' + #numbers.formatDecimal(item.subtotal, 1, 2)}">$0.00</span>
                            </div>
                        </div>

                        <!-- Calculations -->
                        <div class="d-flex justify-content-between mb-2 text-secondary small">
                            <span>Subtotal</span>
                            <span class="fw-semibold text-dark" th:text="${'$' + #numbers.formatDecimal(summary.subtotal, 1, 2)}">$0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2 text-secondary small">
                            <span>Tax (8%)</span>
                            <span class="fw-semibold text-dark" th:text="${'$' + #numbers.formatDecimal(summary.tax, 1, 2)}">$0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 text-secondary small">
                            <span>Delivery Fee</span>
                            <span class="fw-semibold text-dark" th:text="${summary.freeDelivery ? 'FREE' : '$' + #numbers.formatDecimal(summary.deliveryFee, 1, 2)}">$4.99</span>
                        </div>

                        <hr class="my-3">

                        <div class="d-flex justify-content-between mb-4">
                            <span class="fs-5 fw-bold text-dark">Total</span>
                            <span class="fs-4 fw-800 text-danger" th:text="${'$' + #numbers.formatDecimal(summary.total, 1, 2)}">$0.00</span>
                        </div>

                        <button type="submit" class="btn btn-primary-custom btn-lg w-100 rounded-pill fw-bold shadow-sm">
                            <i class="bi bi-bag-check-fill me-1"></i> Place Food Order
                        </button>

                        <div class="text-center mt-3 text-muted small">
                            By placing an order, you agree to our Terms of Service.
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
