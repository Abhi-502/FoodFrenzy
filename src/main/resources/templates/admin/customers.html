<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - FoodFrenzy Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="admin-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar('customers')}"></div>

    <!-- Main Content -->
    <div class="admin-content">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <div>
                <h2 class="fw-800 text-dark mb-0">Customer Accounts</h2>
                <small class="text-muted">Manage registered users, roles, and status</small>
            </div>
            <a th:href="@{/admin/customers/new}" class="btn btn-primary-custom btn-sm rounded-pill">
                <i class="bi bi-person-plus me-1"></i> Add Customer
            </a>
        </div>

        <!-- Flash alerts -->
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Search Bar -->
        <div class="card border-0 shadow-sm rounded-4 p-3 bg-white mb-4">
            <form th:action="@{/admin/customers}" method="get" class="row g-2 align-items-center">
                <div class="col-md-10">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" name="query" th:value="${query}" class="form-control bg-light border-start-0"
                               placeholder="Search customers by name, email, or phone number...">
                    </div>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary-custom w-100">Search</button>
                    <a th:href="@{/admin/customers}" class="btn btn-outline-secondary" title="Reset"><i class="bi bi-arrow-counterclockwise"></i></a>
                </div>
            </form>
        </div>

        <!-- Customers Table -->
        <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="bg-light text-muted small">
                        <tr>
                            <th class="ps-4">Customer Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Roles</th>
                            <th>Status</th>
                            <th>Joined</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="ps-4 py-3">
                                <div class="d-flex align-items-center gap-2">
                                    <div class="bg-primary-subtle text-primary fw-bold rounded-circle d-flex align-items-center justify-content-center"
                                         style="width: 38px; height: 38px; font-size: 0.85rem;"
                                         th:text="${#strings.substring(user.name, 0, 1)}">
                                        U
                                    </div>
                                    <span class="fw-bold text-dark" th:text="${user.name}">Name</span>
                                </div>
                            </td>
                            <td class="text-secondary small" th:text="${user.email}">email@example.com</td>
                            <td class="text-secondary small" th:text="${user.phone}">+1 555-0100</td>
                            <td>
                                <span th:each="role : ${user.roles}"
                                      class="badge rounded-pill me-1"
                                      th:classappend="${role.name == 'ROLE_ADMIN' ? 'bg-danger-subtle text-danger' : 'bg-primary-subtle text-primary'}"
                                      th:text="${role.name == 'ROLE_ADMIN' ? 'ADMIN' : 'CUSTOMER'}">
                                    CUSTOMER
                                </span>
                            </td>
                            <td>
                                <span th:if="${user.active}" class="badge bg-success-subtle text-success rounded-pill">Active</span>
                                <span th:if="${!user.active}" class="badge bg-danger-subtle text-danger rounded-pill">Deactivated</span>
                            </td>
                            <td class="text-muted small" th:text="${#temporals.format(user.createdAt, 'MMM dd, yyyy')}">Date</td>
                            <td class="text-end pe-4">
                                <div class="d-flex justify-content-end gap-1">
                                    <a th:href="@{/admin/customers/{id}/edit(id=${user.id})}"
                                       class="btn btn-light btn-sm rounded-circle text-primary" title="Edit Customer">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/admin/customers/{id}/toggle-status(id=${user.id})}" method="post" class="m-0">
                                        <button type="submit" class="btn btn-light btn-sm rounded-circle"
                                                th:classappend="${user.active ? 'text-danger' : 'text-success'}"
                                                th:title="${user.active ? 'Deactivate' : 'Activate'}"
                                                data-confirm="Change active status for this user?">
                                            <i class="bi" th:classappend="${user.active ? 'bi-person-slash' : 'bi-person-check'}"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${users == null || users.isEmpty()}">
                            <td colspan="7" class="text-center py-5 text-muted">
                                No customers found.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:if="${totalPages > 1}" class="p-3 border-top d-flex justify-content-center">
                <nav>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/admin/customers(page=${currentPage - 1}, query=${query})}">Previous</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${currentPage == i ? 'active' : ''}">
                            <a class="page-link" th:href="@{/admin/customers(page=${i}, query=${query})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/admin/customers(page=${currentPage + 1}, query=${query})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
