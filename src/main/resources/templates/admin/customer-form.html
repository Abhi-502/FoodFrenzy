<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isNew ? 'New Customer - FoodFrenzy Admin' : 'Edit Customer - FoodFrenzy Admin'}">Customer Form</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="admin-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar('customers')}"></div>

    <!-- Main Content -->
    <div class="admin-content">
        <!-- Breadcrumb & Header -->
        <div class="mb-4 pb-3 border-bottom d-flex justify-content-between align-items-center">
            <div>
                <a th:href="@{/admin/customers}" class="small text-muted text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Back to Customers
                </a>
                <h2 class="fw-800 text-dark mb-0 mt-1" th:text="${isNew ? 'Create New Customer' : 'Edit Customer: ' + user.name}">
                    Customer Form
                </h2>
            </div>
        </div>

        <!-- Form Card -->
        <div class="card border-0 shadow-sm rounded-4 bg-white p-4 p-md-5 max-w-lg">
            <form th:action="${isNew ? '/admin/customers' : '/admin/customers/' + user.id + '/edit'}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Full Name</label>
                    <input type="text" name="name" th:value="${user.name}" class="form-control" required placeholder="Alex Johnson">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address</label>
                    <input type="email" name="email" th:value="${user.email}" class="form-control"
                           th:readonly="${!isNew}" th:classappend="${!isNew ? 'bg-light' : ''}" required placeholder="alex@example.com">
                </div>

                <!-- Password field only for new customers -->
                <div class="mb-3" th:if="${isNew}">
                    <label class="form-label small fw-semibold">Temporary Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="Minimum 6 characters">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Contact Phone</label>
                        <input type="text" name="phone" th:value="${user.phone}" class="form-control" placeholder="+1 555-0100">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Role</label>
                        <select name="role" class="form-select">
                            <option value="ROLE_CUSTOMER" th:selected="${!user.admin}">Customer</option>
                            <option value="ROLE_ADMIN" th:selected="${user.admin}">Administrator</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Delivery Address</label>
                    <textarea name="address" rows="2" class="form-control" th:text="${user.address}" placeholder="Street, city, postal code"></textarea>
                </div>

                <div class="mb-4 form-check" th:if="${!isNew}">
                    <input type="checkbox" name="active" class="form-check-input" id="activeCheck" value="true" th:checked="${user.active}">
                    <label class="form-check-label small fw-semibold" for="activeCheck">Active Account (Can log in)</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary-custom rounded-pill px-4">
                        <i class="bi bi-save me-1"></i> Save Customer
                    </button>
                    <a th:href="@{/admin/customers}" class="btn btn-outline-secondary rounded-pill px-4">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
