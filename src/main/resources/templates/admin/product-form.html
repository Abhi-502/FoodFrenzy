<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isNew ? 'New Dish - FoodFrenzy Admin' : 'Edit Dish - FoodFrenzy Admin'}">Product Form</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="admin-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar('products')}"></div>

    <!-- Main Content -->
    <div class="admin-content">
        <!-- Header -->
        <div class="mb-4 pb-3 border-bottom d-flex justify-content-between align-items-center">
            <div>
                <a th:href="@{/admin/products}" class="small text-muted text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Back to Products
                </a>
                <h2 class="fw-800 text-dark mb-0 mt-1" th:text="${isNew ? 'Create New Food Dish' : 'Edit Dish: ' + product.name}">
                    Product Form
                </h2>
            </div>
        </div>

        <!-- Form Card -->
        <div class="card border-0 shadow-sm rounded-4 bg-white p-4 p-md-5 max-w-lg">
            <form th:action="${isNew ? '/admin/products' : '/admin/products/' + product.id + '/edit'}" th:object="${product}" method="post">
                <input type="hidden" th:field="*{id}" th:if="${!isNew}">

                <!-- Product Name -->
                <div class="mb-3">
                    <label for="name" class="form-label small fw-semibold">Dish Name</label>
                    <input type="text" id="name" th:field="*{name}"
                           class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                           placeholder="e.g. Truffle Bacon Smash Burger" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label for="description" class="form-label small fw-semibold">Description & Ingredients</label>
                    <textarea id="description" th:field="*{description}" rows="3"
                              class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                              placeholder="Detail the ingredients, preparation style, and flavors..." required></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <!-- Category, Price, Stock -->
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label for="categoryId" class="form-label small fw-semibold">Category</label>
                        <select id="categoryId" th:field="*{categoryId}"
                                class="form-select" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid' : ''" required>
                            <option value="">Select Category</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="price" class="form-label small fw-semibold">Price ($ USD)</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" min="0.01" id="price" th:field="*{price}"
                                   class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                   placeholder="14.99" required>
                        </div>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="stockQuantity" class="form-label small fw-semibold">Available Stock</label>
                        <input type="number" min="0" id="stockQuantity" th:field="*{stockQuantity}"
                               class="form-control" th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid' : ''"
                               placeholder="25" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
                    </div>
                </div>

                <!-- Image URL & Prep time -->
                <div class="row g-3 mb-4">
                    <div class="col-md-8">
                        <label for="imageUrl" class="form-label small fw-semibold">Food Image URL</label>
                        <input type="url" id="imageUrl" th:field="*{imageUrl}" class="form-control"
                               placeholder="https://images.unsplash.com/photo-...">
                        <small class="text-muted">Unsplash or hosted image URL</small>
                    </div>
                    <div class="col-md-4">
                        <label for="preparationTimeMinutes" class="form-label small fw-semibold">Prep Time (mins)</label>
                        <input type="number" min="1" id="preparationTimeMinutes" th:field="*{preparationTimeMinutes}"
                               class="form-control" placeholder="20">
                    </div>
                </div>

                <!-- Checkboxes: Active, Featured, Veg -->
                <div class="p-3 bg-light rounded-3 mb-4 border d-flex flex-wrap gap-4">
                    <div class="form-check">
                        <input type="checkbox" id="active" th:field="*{active}" class="form-check-input">
                        <label for="active" class="form-check-label small fw-semibold">Active (Available on Menu)</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="featured" th:field="*{featured}" class="form-check-input">
                        <label for="featured" class="form-check-label small fw-semibold">Featured on Homepage</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="vegetarian" th:field="*{vegetarian}" class="form-check-input">
                        <label for="vegetarian" class="form-check-label small fw-semibold">Vegetarian Dish</label>
                    </div>
                </div>

                <!-- Submit / Cancel -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary-custom rounded-pill px-4">
                        <i class="bi bi-save me-1"></i> Save Product
                    </button>
                    <a th:href="@{/admin/products}" class="btn btn-outline-secondary rounded-pill px-4">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
