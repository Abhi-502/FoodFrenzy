<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <!-- Brand Logo -->
        <a class="navbar-brand brand-logo" th:href="@{/}">
            <i class="bi bi-fire"></i> FoodFrenzy
        </a>

        <!-- Mobile Toggler -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <!-- Nav Links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/}">
                        <i class="bi bi-house me-1"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/menu}">
                        <i class="bi bi-grid me-1"></i> Menu
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/about}">
                        <i class="bi bi-info-circle me-1"></i> About
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/contact}">
                        <i class="bi bi-telephone me-1"></i> Contact
                    </a>
                </li>
            </ul>

            <!-- Right Actions -->
            <div class="d-flex align-items-center gap-3">
                <!-- Cart Button -->
                <a th:href="@{/cart}" class="btn btn-light position-relative rounded-pill px-3 py-2 border shadow-sm">
                    <i class="bi bi-cart3 fs-5 text-dark"></i>
                    <span class="cart-badge" th:text="${cartCount != null ? cartCount : 0}">0</span>
                </a>

                <!-- Authenticated User Menu -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="btn btn-outline-secondary dropdown-toggle rounded-pill px-3 py-2 d-flex align-items-center gap-2"
                            type="button" id="userMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle fs-5 text-primary"></i>
                        <span class="fw-semibold" th:text="${currentUser != null ? currentUser.name : 'Account'}">Account</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-md border-0 mt-2" aria-labelledby="userMenuButton">
                        <!-- Admin Access Link -->
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item py-2 text-danger fw-bold" th:href="@{/admin/dashboard}">
                                <i class="bi bi-speedometer2 me-2"></i> Admin Dashboard
                            </a>
                        </li>
                        <li sec:authorize="hasRole('ADMIN')"><hr class="dropdown-divider"></li>

                        <li>
                            <a class="dropdown-item py-2" th:href="@{/my-orders}">
                                <i class="bi bi-receipt me-2 text-primary"></i> My Orders
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item py-2" th:href="@{/profile}">
                                <i class="bi bi-gear me-2 text-secondary"></i> Profile Settings
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item py-2 text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i> Sign Out
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>

                <!-- Unauthenticated Links -->
                <div sec:authorize="!isAuthenticated()" class="d-flex align-items-center gap-2">
                    <a th:href="@{/login}" class="btn btn-outline-primary-custom">Sign In</a>
                    <a th:href="@{/register}" class="btn btn-primary-custom">Register</a>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
