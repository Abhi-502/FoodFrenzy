<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - FoodFrenzy</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<!-- Navigation -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Alerts -->
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="brand-logo fs-2 justify-content-center mb-2">
                            <i class="bi bi-fire text-warning"></i> FoodFrenzy
                        </div>
                        <h4 class="fw-bold text-dark">Welcome Back!</h4>
                        <p class="text-muted small">Sign in to your account to order and track food.</p>
                    </div>

                    <!-- Flash messages from URL params -->
                    <div th:if="${param.error}" class="alert alert-danger py-2 px-3 small rounded-3 mb-3">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Invalid email or password. Please try again.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info py-2 px-3 small rounded-3 mb-3">
                        <i class="bi bi-info-circle-fill me-1"></i> You have been successfully signed out.
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/login}" method="post">
                        <!-- CSRF Token -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-envelope text-muted"></i>
                                </span>
                                <input type="email" id="email" name="email" class="form-control bg-light border-start-0"
                                       placeholder="name@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="form-label fw-semibold small">Password</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-lock text-muted"></i>
                                </span>
                                <input type="password" id="password" name="password" class="form-control bg-light border-start-0"
                                       placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-bold mb-3">
                            Sign In
                        </button>
                    </form>

                    <!-- Quick Demo Credentials Filler -->
                    <div class="p-3 bg-light rounded-3 mb-3 border">
                        <small class="text-muted fw-bold d-block mb-2 text-uppercase" style="font-size: 0.72rem;">
                            <i class="bi bi-lightning-charge text-warning"></i> Demo Accounts (One-Click Sign In)
                        </small>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-outline-danger btn-sm w-50"
                                    onclick="fillCredentials('admin@foodfrenzy.com', 'Admin@12345')">
                                <i class="bi bi-shield-lock me-1"></i> Admin Demo
                            </button>
                            <button type="button" class="btn btn-outline-success btn-sm w-50"
                                    onclick="fillCredentials('customer@foodfrenzy.com', 'Customer@12345')">
                                <i class="bi bi-person me-1"></i> Customer Demo
                            </button>
                        </div>
                    </div>

                    <div class="text-center pt-3 border-top">
                        <p class="small text-muted mb-0">
                            Don't have an account yet?
                            <a th:href="@{/register}" class="fw-bold text-danger">Create an Account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
