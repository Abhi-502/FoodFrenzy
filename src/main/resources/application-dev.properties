# Development Profile with embedded MySQL-compatible H2
spring.datasource.url=jdbc:h2:mem:foodfrenzy;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway disabled in dev memory mode so Hibernate generates schema and DataInitializer seeds data
spring.flyway.enabled=false
